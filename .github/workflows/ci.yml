name: SalesChamp CI + Jira

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, closed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: saleschamp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks (Django)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend checks (Next.js)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  jira-development-sync:
    name: Sync commits and merged work to Jira
    needs: [backend, frontend]
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Link commits and update Jira issue status
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            const base = process.env.JIRA_BASE_URL?.replace(/\/$/, '');
            const email = process.env.JIRA_EMAIL;
            const token = process.env.JIRA_API_TOKEN;
            if (!base || !email || !token) {
              core.setFailed('Missing JIRA_BASE_URL, JIRA_EMAIL or JIRA_API_TOKEN repository secrets.');
              return;
            }
            const auth = 'Basic ' + Buffer.from(email + ':' + token).toString('base64');
            async function jira(path, method='GET', body) {
              const res = await fetch(base + path, {
                method,
                headers: { Authorization: auth, Accept: 'application/json', 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined
              });
              const raw = await res.text();
              if (!res.ok) throw new Error(`Jira ${method} ${path}: ${res.status} ${raw}`);
              return raw ? JSON.parse(raw) : {};
            }
            const keyPattern = /\bSCRUM-\d+\b/gi;
            const unique = values => [...new Set(values.flatMap(v => (v || '').match(keyPattern) || []).map(x => x.toUpperCase()))];
            async function commentAndTransition(key, message, targetCategory) {
              const comments = await jira(`/rest/api/3/issue/${key}/comment?maxResults=100`);
              const existing = (comments.comments || []).some(c => JSON.stringify(c.body).includes(message.match(/Commit: ([a-f0-9]{7,40})/)?.[1] || '__no_sha__') && message.includes('Commit:'));
              if (!existing) {
                await jira(`/rest/api/3/issue/${key}/comment`, 'POST', {
                  body: { type: 'doc', version: 1, content: [{ type: 'paragraph', content: [{ type: 'text', text: message }] }] }
                });
              }
              const transitions = await jira(`/rest/api/3/issue/${key}/transitions`);
              const candidate = (transitions.transitions || []).find(t => t.to?.statusCategory?.key === targetCategory);
              if (candidate) {
                await jira(`/rest/api/3/issue/${key}/transitions`, 'POST', { transition: { id: candidate.id } });
                core.info(`${key}: transitioned to ${candidate.to.name}`);
              } else {
                core.info(`${key}: no available transition to category ${targetCategory}; left status unchanged`);
              }
            }

            const event = context.eventName;
            let records = [];
            if (event === 'push') {
              const branch = context.ref.replace('refs/heads/', '');
              for (const commit of (context.payload.commits || [])) {
                records.push({
                  keys: unique([branch, commit.message]),
                  sha: commit.id,
                  url: commit.url,
                  message: commit.message.split('\n')[0]
                });
              }
            } else if (event === 'pull_request') {
              const pr = context.payload.pull_request;
              const commits = await github.rest.pulls.listCommits({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100
              });
              records = [{
                keys: unique([pr.title, pr.body, pr.head.ref, ...commits.data.map(c => c.commit.message)]),
                sha: pr.merge_commit_sha,
                url: pr.html_url,
                message: `Merged PR #${pr.number}: ${pr.title}`
              }];
            }

            for (const record of records) {
              for (const key of record.keys) {
                const detail = event === 'push'
                  ? `Commit: ${record.sha} | ${record.message} | ${record.url}`
                  : `${record.message} | Merge commit: ${record.sha} | ${record.url}`;
                await commentAndTransition(key, detail, event === 'push' ? 'indeterminate' : 'done');
              }
            }

  jira-release-version:
    name: Create Jira release version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Create Jira project version from GitHub Release
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            const base = process.env.JIRA_BASE_URL?.replace(/\/$/, '');
            const email = process.env.JIRA_EMAIL;
            const token = process.env.JIRA_API_TOKEN;
            if (!base || !email || !token) {
              core.setFailed('Missing JIRA_BASE_URL, JIRA_EMAIL or JIRA_API_TOKEN repository secrets.');
              return;
            }
            const auth = 'Basic ' + Buffer.from(email + ':' + token).toString('base64');
            async function jira(path, method='GET', body) {
              const res = await fetch(base + path, {
                method,
                headers: { Authorization: auth, Accept: 'application/json', 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined
              });
              const raw = await res.text();
              if (!res.ok) throw new Error(`Jira ${method} ${path}: ${res.status} ${raw}`);
              return raw ? JSON.parse(raw) : {};
            }
            const release = context.payload.release;
            const project = await jira('/rest/api/3/project/SCRUM');
            const versions = await jira('/rest/api/3/project/SCRUM/versions');
            let version = versions.find(v => v.name === release.tag_name);
            if (!version) {
              version = await jira('/rest/api/3/version', 'POST', {
                projectId: Number(project.id),
                name: release.tag_name,
                description: release.body || `GitHub Release ${release.html_url}`,
                released: true,
                releaseDate: release.published_at.slice(0, 10)
              });
            }
            core.info(`Jira version ${version.name} is available (id ${version.id}).`);
            const keys = [...new Set(((release.name || '') + '\n' + (release.body || '')).match(/\bSCRUM-\d+\b/gi) || [])];
            for (const rawKey of keys) {
              const key = rawKey.toUpperCase();
              await jira(`/rest/api/3/issue/${key}`, 'PUT', { fields: { fixVersions: [{ id: String(version.id) }] } });
              core.info(`${key}: assigned fixVersion ${version.name}`);
            }
